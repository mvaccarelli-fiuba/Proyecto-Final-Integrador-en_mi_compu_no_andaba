services:
  db:
    image: mysql:8.0
    container_name: crusty_crab_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: crusty_crab
      MYSQL_USER: tp_user
      MYSQL_PASSWORD: "1234"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d
    networks:
      - crusty_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crusty_crab_backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tp_user
      DB_PASSWORD: "1234"
      DB_NAME: crusty_crab
      FLASK_ENV: development
      FRONTEND_URL: "http://127.0.0.1:5001"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on: 
      db:
        condition: service_healthy
    networks:
      - crusty_network
    volumes:
      - ./backend:/app
    command: python app.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crusty_crab_frontend
    environment:
      BACKEND_URL: http://backend:5000
      FLASK_ENV: development
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - backend
    networks:
      - crusty_network
    volumes:
      - ./frontend:/app
    command: python app.py

volumes:
  mysql_data:

networks:
  crusty_network:
    driver: bridge
